[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "promise-integrity"
version = "1.0.0"
description = "Auditable delivery analytics: recorded promises, customer reviews, and scenario economics"
requires-python = ">=3.11"
dependencies = ["duckdb>=1.2,<2", "pandas>=2.2,<4", "numpy>=2,<3", "scipy>=1.14,<2", "scikit-learn>=1.5,<2", "plotly>=6,<8"]

[tool.setuptools.package-data]
promise_integrity = ["*.html"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "nbformat>=5", "nbclient>=0.10", "ipykernel>=6"]
docs = ["reportlab>=4,<6", "pypdf>=5,<7"]
spark = ["pyspark>=3.5,<5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
